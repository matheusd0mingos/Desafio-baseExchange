name: order-exposure

services:
  # Roda uma vez e termina: sorteia as senhas na primeira execução.
  secrets-init:
    image: alpine:3.20
    volumes:
      - secrets:/secrets
    command:
      - sh
      - -c
      - |
        set -e
        if [ ! -f /secrets/postgres_password ]; then
          gerar() { tr -dc 'A-Za-z0-9' </dev/urandom | head -c 24; }
          PG=$$(gerar)
          printf '%s' "$$PG" > /secrets/postgres_password
          printf '%s' "$$(gerar)" > /secrets/pgadmin_password
          printf 'Host=postgres;Database=orderdb;Username=postgres;Password=%s' "$$PG" > /secrets/ConnectionStrings__orderdb
          chmod 444 /secrets/*
          echo "Senhas geradas."
        fi
        echo "pgAdmin  -> admin@admin.com / $$(cat /secrets/pgadmin_password)"
        echo "Postgres -> postgres / $$(cat /secrets/postgres_password)"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: orderdb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    environment:
      CLUSTER_ID: "order-exposure-local-01"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    environment:
      KAFKA_CLUSTERS_0_NAME: order-exposure
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      - kafka
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/OrderAccumulator.Api/Dockerfile
    image: order-accumulator-api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__kafka: "kafka:9092"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
      OTEL_SERVICE_NAME: "order-accumulator-api"
    volumes:
      - secrets:/run/secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  front:
    build:
      context: .
      dockerfile: src/OrderGenerator/Dockerfile
    image: order-generator
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api
    restart: unless-stopped

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.5
    environment:
      ASPIRE_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:9.18
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
    volumes:
      - secrets:/run/secrets:ro
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  secrets: