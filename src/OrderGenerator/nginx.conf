server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Tudo que começa com /api vai para a API: front e API na mesma origem, sem CORS.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Qualquer outra rota é do Blazor: devolve o index.html e o roteador do Blazor resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}