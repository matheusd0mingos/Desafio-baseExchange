server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker: reconsulta o endereço da API, mesmo se ela reiniciar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # Tudo que começa com /api vai para a API: front e API na mesma origem, sem CORS.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Qualquer outra rota é do Blazor: devolve o index.html e o roteador do Blazor resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}